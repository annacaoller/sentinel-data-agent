[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-data-agent"
version = "0.1.0"
description = "Deterministic DAG-based autonomous data analysis agent for tabular datasets, with auditability and graceful degradation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Anna C.O.C." }
]
keywords = [
  "agent", "dag", "data-analysis", "data-science", "auditability", "deterministic", "ml", "kaggle"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries"
]

dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "pyarrow>=15.0",
  "pydantic>=2.6",
  "networkx>=3.2",
  "typer>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
  "click>=8.1.7",
  "joblib>=1.3"
]

[project.urls]
Repository = "https://github.com/annacaoller/sentinel-data-agent"
Issues = "https://github.com/annacaoller/sentinel-data-agent/issues"

[project.scripts]
sentinel = "sentinel.cli.main:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true